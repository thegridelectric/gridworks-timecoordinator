[project]
name = "gridworks-timecoordinator"
version = "0.0.1"
description = "GridWorks time coordinator — the simulated-time authority"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "gridworks-base>=0.5.6",
]

[project.scripts]
tc-hello = "gwtc.hello:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
markers = [
    "live: needs a reachable rabbit broker (run with `pytest -m live`)",
]
addopts = "-m 'not live'"

[tool.hatch.build.targets.wheel]
packages = ["src/gwtc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
